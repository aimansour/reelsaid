[project]
name = "reelsaid"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ai-edge-litert==2.3.0",
    "apify==4.2.1",
    "curl-cffi==0.17.0",
    "numpy==2.5.4",
    "onnxruntime==1.31.1",
    "pycountry==26.2.16",
    "regex==2026.11.7",
]

[dependency-groups]
dev = ["jsonschema==4.26.0", "pytest==9.2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
