name: ReelSaid runner health

on:
  schedule:
    - cron: '23 6,18 * * *'
  workflow_dispatch:
    inputs:
      scenario:
        description: Verification case
        required: true
        type: choice
        default: normal
        options: [normal, checkout-failure, runtime-failure]

permissions:
  contents: read

concurrency:
  group: reelsaid-runner-health
  cancel-in-progress: false

jobs:
  check:
    name: Check ReelSaid on the runner
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' ||
      (github.actor == 'aimansour' && github.triggering_actor == 'aimansour'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out verification workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run verification
        env:
          MONITOR_CASE: ${{ inputs.scenario || 'normal' }}
          REELSAID_GROQ_KEYS: ${{ (github.event_name == 'schedule' || inputs.scenario == 'normal') && secrets.RUNNER_GROQ_KEYS || '' }}
        run: bash .github/scripts/monitor.sh
