name: Verify

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact revision approved for verification
        required: true
        type: string
      check:
        description: Verification to run
        required: true
        type: choice
        options: [pass, fail, run, cloud, measure, account, package, launch-tasks, periodic, runner-health, compare]
      comparison:
        description: Comparison case group
        required: false
        type: choice
        default: contract
        options: [contract, single, batch, audio, input-a, input-b, standby, standby-probe, standby-multi, standby-cross, standby-runtime, standby-cache, timing, startup, cached-base, lean-media, timestamps, native, native-fresh, native-repeat, retrieval-timing, release-comparison]

permissions:
  contents: read

concurrency:
  group: reelsaid-maintenance
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.actor == 'aimansour' &&
      github.triggering_actor == 'aimansour'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run verification
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          CHECK_MODE: ${{ inputs.check }}
          COMPARISON_GROUP: ${{ inputs.comparison }}
          PERIODIC_SOURCE_REVISION: ${{ secrets.PERIODIC_SOURCE_REVISION }}
          SOURCE_REPOSITORY: https://github.com/${{ github.repository_owner }}/reelsaid-core.git
          APIFY_TOKEN: ${{ inputs.check != 'runner-health' && secrets.APIFY_TOKEN || '' }}
          APIFY_STANDBY_TEST_TOKEN: ${{ inputs.comparison == 'standby-cross' && secrets.APIFY_STANDBY_TEST_TOKEN || '' }}
          REELSAID_GROQ_KEYS: ${{ inputs.check == 'runner-health' && secrets.RUNNER_GROQ_KEYS || '' }}
        shell: bash
        run: |
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          selection='head'
          if [[ "$CHECK_MODE" == periodic ]]; then
            if [[ -n "$SOURCE_REVISION" && "$SOURCE_REVISION" != "$PERIODIC_SOURCE_REVISION" ]]; then
              printf '%s\n' 'Approved source revision required.'
              exit 1
            fi
            SOURCE_REVISION=$PERIODIC_SOURCE_REVISION
            selection=approved
          fi
          if [[ ! "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'Approved source revision required.'
            exit 1
          fi
          if ! bash .github/scripts/checkout-source.sh "$scratch" "$SOURCE_REVISION" "$selection" >/dev/null 2>&1; then
            printf '%s\n' 'Approved source revision unavailable.'
            exit 1
          fi
          unset SOURCE_REPOSITORY PERIODIC_SOURCE_REVISION
          bash .github/scripts/verify.sh "$scratch" "$CHECK_MODE" "$COMPARISON_GROUP"
