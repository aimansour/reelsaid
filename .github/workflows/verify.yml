name: Verify

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact revision approved for verification
        required: true
        type: string
      check:
        description: Verification to run
        required: true
        type: choice
        options: [pass, fail, run, cloud, measure, account, package, periodic]

permissions:
  contents: read

concurrency:
  group: reelsaid-maintenance
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run verification
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          CHECK_MODE: ${{ inputs.check }}
          SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE }}
          SOURCE_KEY: ${{ secrets.PRIVATE_SOURCE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        shell: bash
        run: |
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            CHECK_MODE=periodic
          elif [[ ! "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'Approved source revision required.'
            exit 1
          fi
          if ! bash .github/scripts/private-source.sh "$scratch" "$SOURCE_REVISION" >/dev/null 2>&1; then
            printf '%s\n' 'Approved source revision unavailable.'
            exit 1
          fi
          unset SOURCE_KEY SOURCE_REPOSITORY
          bash .github/scripts/verify.sh "$scratch" "$CHECK_MODE"
